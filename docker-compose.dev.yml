version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: proc_to_pay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Backend API (Development mode with volume mounts)
  app:
    build: .
    volumes:
      # Mount source code for live reloading
      - ./src:/app/src
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      # Exclude node_modules to use container's version
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/proc_to_pay
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - JWT_EXPIRES_IN=7d
      - PORT=5000
    ports:
      - "5000:5000"
      - "9229:9229" # Debug port
    depends_on:
      - postgres
      - redis
    # Use nodemon for auto-restart on file changes with debug support
    command: sh -c "NODE_TLS_REJECT_UNAUTHORIZED=0 npx prisma generate && npx nodemon --inspect=0.0.0.0:9229 server.js"

volumes:
  postgres_data:
  redis_data:
