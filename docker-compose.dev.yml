services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: proctopay_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    volumes:
      - ./.mailhog:/maildir
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /maildir
    command: ['/MailHog', '-storage=maildir', '-maildir-path=/maildir']

  # Backend API (Development mode with volume mounts)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code for live reloading
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./prisma:/app/prisma
      # Exclude node_modules to use container's version
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/proctopay_dev
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=dev-session-secret-key-change-in-production
      - APP_URL=http://localhost:3000
      - API_URL=http://localhost:4000
      - MAIL_FROM=shubham34934@gmail.com
      - AUTH_MODE=otp
      - OTP_LENGTH=6
      - OTP_TTL_SECONDS=600
      - PORT=4000
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    ports:
      - '4000:4000'
      - '9229:9229' # Debug port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Entrypoint handles migrations, Prisma client generation, and seeding automatically
    # Command: start dev server (Prisma client already generated by entrypoint)
    # Using --transpile-only to skip type checking and allow server to start
    # NODE_OPTIONS='--enable-source-maps' enables source map support for debugging
    command: sh -c "NODE_OPTIONS='--enable-source-maps' npx ts-node-dev --inspect=0.0.0.0:9229 --respawn --transpile-only src/server.ts"

  # Prisma Studio (Development only)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./prisma:/app/prisma
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/proctopay_dev
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - PRISMA_CLI_BINARY_TARGETS=linux-musl-arm64-openssl-3.0.x
      - PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING=1
    ports:
      - '5556:5555'
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma studio --port 5555 --hostname 0.0.0.0"

  # Frontend (Vite dev server)
  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      # Exclude node_modules to use container's version and prevent file overflow
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=200
    ports:
      - '3000:3000'
    depends_on:
      app:
        condition: service_started
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  postgres_dev_data:
  redis_dev_data:
